<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andamento de Sinistros</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#ffffff;--card:#fff;--ink:#1f2a37;--mut:#64748b;--line:#e2e8f0;--head:#2b3a4a;--red:#d71920;
--y:#f5a623;--g:#2e9e4f;--b:#1f6feb;--zh:#475569}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px}
.wrap{max-width:1500px;margin:0 auto;padding:14px 24px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 18px;border-bottom:3px solid var(--red)}
.logo{font-weight:900;font-style:italic;color:var(--red);font-size:34px;letter-spacing:-1px;padding-right:16px;border-right:1px solid var(--line)}
.logo small{font-size:15px}
h1{margin:0;font-size:26px;line-height:1.1}
.sub{color:var(--mut);display:flex;align-items:center;gap:6px;margin-top:2px}
.sub input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 6px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.box{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.box.on{outline:2px solid var(--red)}
.box b{font-size:28px;line-height:1}
.box span{color:var(--mut);font-size:12px;line-height:1.25}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.total b{font-size:38px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 10px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:900px;table-layout:fixed}
tbody tr:not(.open) td.t,tbody tr:not(.open) td.s,tbody tr:not(.open) .ob,.sit span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:not(.open) .ex{display:none}
.sit{min-width:0}.sit span{min-width:0}tr.open .sit{white-space:normal}tr.open .sit span{white-space:normal}
.zh{margin:1px 0 0 22px;font-size:13px;color:var(--zh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tr.open .zh{white-space:normal}
.hz{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;margin-top:2px;color:var(--zh)}.zh0{color:var(--zh)}.z0{margin-left:0}.pv .zh{margin:0;font-size:12px}
.cap .tools,.cap .bar{display:none}.cap .act,.cap th:nth-child(6),.cap td:nth-child(6){display:none}.cap th{position:static}.cap .tw{overflow:visible}
[hidden]{display:none!important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.ch b{font-size:17px}.cp .pv{text-align:right}
.ct{color:var(--mut);font-size:12px;text-transform:uppercase}
.cs{display:flex;align-items:center;gap:6px;font-weight:600;flex-wrap:wrap}.cs .zh{margin:0;font-weight:400}
.cb{margin-top:4px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px}
.card .zh{white-space:normal}
.card:not(.open) .ob,.card:not(.open) .cb .zh{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.card:not(.open) .ex{display:none}
.ca{margin-top:auto;padding-top:6px;display:flex;gap:6px;justify-content:flex-end}
.ca button{padding:2px 8px;font-size:12px}.ca button[data-x]{color:var(--red);border-color:var(--red)}
button.on2{background:var(--red);border-color:var(--red);color:#fff}
.cap .ca{display:none}
.act button[data-x]{color:var(--red);border-color:var(--red)}
th{position:sticky;top:0;background:#fff;color:var(--ink);border-bottom:2px solid var(--red);text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:rgba(127,127,127,.06)}
tbody tr:hover td{background:rgba(215,25,32,.07)}
th:nth-child(1){width:110px}th:nth-child(2){width:210px}th:nth-child(3){width:200px}th:nth-child(4){width:auto}th:nth-child(5){width:120px}th:nth-child(6){width:235px}
@media (min-width:1100px){body{font-size:15px}td,th{padding:8px 14px}.tw{overflow:visible}table{min-width:0}}
td.v{font-weight:700}
td.t{color:var(--mut);font-size:12px;text-transform:uppercase}
.sit{display:flex;gap:8px;align-items:center;white-space:nowrap}
.ex{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--mut);font-size:12px;white-space:pre-line}
.act{white-space:nowrap}
.pv{white-space:nowrap;font-weight:600}.pv small{display:block;font-weight:400;color:var(--mut)}.pv.late,.pv.late small{color:var(--red)}
.act button{padding:2px 8px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mut)}
dialog input,dialog select,dialog textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.empty{padding:24px;text-align:center;color:var(--mut)}
@page{size:A4 landscape;margin:9mm}
@media print{
:root,:root[data-theme]{--bg:#fff!important;--card:#fff!important;--ink:#111!important;--mut:#555!important;--zh:#374151!important;--line:#ccc!important;--head:#2b3a4a!important}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tools,.bar,.act{display:none}
.wrap{max-width:none;padding:0}body{font-size:10px;background:#fff}
header{padding:8px 12px}.logo{font-size:24px}h1{font-size:18px}.sub input{border:0;padding:0;width:auto}
.sum{gap:6px;margin:8px 0}.box{padding:6px 8px}.box b{font-size:20px}.total b{font-size:24px}
table{min-width:0}th,td{padding:5px 8px}thead{display:table-header-group}tr{break-inside:avoid}
th:nth-child(6),td:nth-child(6){display:none}
.tw{overflow:visible}th{position:static}tbody tr:hover td{background:none}
.cards{grid-template-columns:repeat(3,1fr);gap:6px}.card{break-inside:avoid;padding:6px 8px}.card .ob,.card .cb .zh{display:block!important;overflow:visible!important}.card .ex{display:block!important}.ca{display:none}
.zh,.ob,.sit span,td.t,td.s{white-space:normal!important;overflow:visible!important;text-overflow:clip!important}.ex{display:block!important}.act button{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">J&amp;T <small>EXPRESS</small></div>
  <div>
    <h1>ANDAMENTO DE SINISTROS</h1>
    <div class="sub">Atualizado em <input type="date" id="dt"><span id="bk" style="font-size:12px;margin-left:10px"></span></div>
  </div>
  <div class="tools">
    <button class="pri" id="add">+ Novo sinistro</button>
    <button id="img">📷 Baixar imagem</button>
    <button id="print">⬇ Gerar PDF</button>
    <button id="bkb">💾 Salvar backup</button><button id="rsb">📂 Restaurar</button><input type="file" id="rf" accept=".json,application/json" hidden>
  </div>
</header>

<div class="sum" id="sum"></div>

<div class="bar"><input id="q" placeholder="Buscar placa, tipo ou observação…"><span id="trn" style="font-size:12px;color:var(--red);align-self:center"></span><button id="vc">▦ Cards</button><button id="vt">☰ Tabela</button><button id="all">Expandir tudo</button></div>
<div class="tw" id="tw"><table>
  <thead><tr><th>Veículo<span class="hz">车辆</span></th><th>Tipo<span class="hz">类型</span></th><th>Situação<span class="hz">状态</span></th><th>Tratativa / Observações<span class="hz">处理情况 / 备注</span></th><th>Previsão<span class="hz">预计日期</span></th><th class="act"></th></tr></thead>
  <tbody id="tb"></tbody>
</table></div>
<div class="cards" id="cards"></div>
</div>

<dialog id="dlg"><div>
  <label>Veículo (placa)</label><input id="f_v">
  <label>Tipo</label><input id="f_t" placeholder="Ex.: COLISÃO COM TERCEIRO">
  <label>Tipo em mandarim (opcional, se ficar vazio traduz sozinho)</label><input id="f_tz" placeholder="Ex.: 与第三方碰撞">
  <label>Categoria (resumo)</label><select id="f_c"></select>
  <div id="f_cow" hidden><label>Qual categoria? (escreva)</label><input id="f_co" placeholder="Ex.: Aguardando peça"></div>
  <label>Situação (texto exibido)</label><input id="f_s" placeholder="Ex.: Em andamento">
  <label>Situação em mandarim (opcional, preenche sozinho se ficar vazio)</label><input id="f_z" placeholder="Ex.: 进行中">
  <label>Tratativa / Observações</label><textarea id="f_o" rows="4"></textarea>
  <label>Tratativa em mandarim (opcional, se ficar vazio traduz sozinho)</label><textarea id="f_oz" rows="3" placeholder="Cole aqui a tradução em chinês"></textarea>
  <button type="button" id="tr" style="margin-top:6px">Traduzir no Google Tradutor ↗</button>
  <label>Previsão (conclusão / retorno)</label><input type="date" id="f_p">
  <label>Detalhes extras (terceiro, chassi, empresa, rota…)</label><textarea id="f_e" rows="2"></textarea>
  <div class="row"><button id="cx">Cancelar</button><button class="pri" id="ok">Salvar</button></div>
</div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const CATS=[
 {id:"terc",n:"Aguardando retorno de terceiros",c:"var(--y)"},
 {id:"trat",n:"Em tratativa / acompanhamento / conclusão de reparo",c:"var(--g)"},
 {id:"jur",n:"Jurídico",c:"var(--b)"},
 {id:"orc",n:"Aguardando orçamento / avaliação",c:"var(--y)"},
 {id:"doc",n:"Aguardando documentação / B.O.",c:"var(--y)"},
 {id:"out",n:"Outros",c:"var(--mut)"}];
const SEED=[];
const KEY="sinistros-v1";
let S={date:new Date().toISOString().slice(0,10),items:SEED.map((x,i)=>({...x,id:i+1}))};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
let filter=null,editId=null;const exp=new Set();let view="cards";try{view=localStorage.getItem("sinistros-view")||"cards"}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d.split("-").reverse().join("/");
function prev(d){
  if(!d)return '<span style="color:var(--mut)">—</span>';
  const t=new Date().toISOString().slice(0,10),n=Math.round((new Date(d)-new Date(t))/864e5);
  const tx=n<0?`atrasado ${-n} d`:n===0?"hoje":`em ${n} d`;
  return `<div class="pv ${n<0?"late":""}">${fmt(d)}<small>${tx} · ${n<0?`逾期${-n}天`:n===0?"今天":`还有${n}天`}</small></div>`;
}
const cat=id=>CATS.find(c=>c.id===id)||CATS[0];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
$("f_c").innerHTML=CATS.map(c=>`<option value="${c.id}">${c.n}</option>`).join("");
$("dt").value=S.date;
const tgl=()=>{$("f_cow").hidden=$("f_c").value!=="out"};$("f_c").onchange=tgl;
const CZ={terc:"等待第三方回复",trat:"处理中 / 跟进 / 维修完成",jur:"法务处理",orc:"等待报价 / 评估",doc:"等待文件 / 警方报告(B.O.)",out:"其他"};
const TZ={"colisão com terceiro":"与第三方碰撞","colisão com veículo terceiro":"与第三方车辆碰撞","capotamento":"翻车","colisão no pátio":"场站内碰撞","colisão envolvendo posto":"涉及加油站的碰撞","colisão em viagem":"行驶途中碰撞","tombamento":"侧翻","roubo":"被盗","furto":"盗窃","incêndio":"火灾","avaria":"车辆损坏","atropelamento":"撞人"};
const nz=t=>(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const TZN=Object.fromEntries(Object.entries(TZ).map(([k,v])=>[nz(k),v]));
const WZ={colisao:"碰撞",terceiro:"第三方",terceiros:"第三方",veiculo:"车辆",patio:"场站",posto:"加油站",viagem:"行驶途中",capotamento:"翻车",tombamento:"侧翻",roubo:"被盗",furto:"盗窃",incendio:"火灾",avaria:"损坏",atropelamento:"撞人",motorista:"司机",caminhao:"卡车",carreta:"半挂车",seguradora:"保险公司"};
const STOP=["com","de","do","da","no","na","em","o","a","e","envolvendo"];
const tzLocal=t=>{const a=t.trim().split(/\s+[–-]\s+/),k=nz(a[a.length-1]);if(TZN[k])return TZN[k];
  const w=k.split(/[^a-z]+/).filter(Boolean);
  if(w.includes("colisao")&&(w.includes("terceiro")||w.includes("terceiros")))return w.includes("veiculo")?"与第三方车辆碰撞":"与第三方碰撞";
  const need=w.filter(x=>!STOP.includes(x)),z=need.map(x=>WZ[x]).filter(Boolean);
  return need.length&&z.length===need.length?z.join(" "):""};
const tz=i=>i.tz||tzLocal(i.t||"")||(i.tzs===i.t?i.tza:"")||"";
const oz=i=>i.oz||(i.ozs===i.o?i.oza:"")||"";
const ZH={"em andamento":"进行中","aguardando":"等待中","pendente":"待处理","em tratativa":"处理中","em acompanhamento":"跟进中","jurídico":"法务处理中","juridico":"法务处理中","aguardando retorno de terceiros":"等待第三方回复","aguardando orçamento":"等待报价","aguardando avaliação":"等待评估","aguardando documentação":"等待文件","aguardando b.o.":"等待警方报告(B.O.)","aguardando peça":"等待配件","aguardando seguradora":"等待保险公司","em reparo":"维修中","concluído":"已完成","finalizado":"已完成","cancelado":"已取消"};
const CZH={terc:"等待第三方回复",trat:"处理中 / 跟进",jur:"法务处理中",orc:"等待报价 / 评估",doc:"等待文件 / 警方报告(B.O.)"};
const zh=i=>i.z||ZH[(i.s||"").trim().toLowerCase()]||(i.c!=="out"?CZH[i.c]:"")||"";
const sit=i=>i.c==="out"&&i.co?(i.s?i.s+" · "+i.co:i.co):i.s;
$("dt").onchange=e=>{S.date=e.target.value;save()};

function render(){setTimeout(labelAll,0);setTimeout(autoTr,50);
  const n=S.items.length;
  $("sum").innerHTML=`<div class="box total" style="cursor:default;border-top-color:var(--red)"><div><span>TOTAL DE SINISTROS · <span class="zh0">案件总数</span></span><br><b>${String(n).padStart(2,"0")}</b><br><span>EM ACOMPANHAMENTO · <span class="zh0">跟进中</span></span></div></div>`+
   CATS.map(c=>{const k=S.items.filter(i=>i.c===c.id).length;if(c.id==="out"&&!k)return"";
    return `<div class="box ${filter===c.id?"on":""}" data-c="${c.id}" style="border-top-color:${c.c}"><i class="dot" style="background:${c.c}"></i><div><b>${String(k).padStart(2,"0")}</b><br><span>${c.n}</span><br><span class="zh0">${CZ[c.id]}</span></div></div>`}).join("");
  document.querySelectorAll(".box[data-c]").forEach(b=>b.onclick=()=>{filter=filter===b.dataset.c?null:b.dataset.c;render()});
  const q=$("q").value.toLowerCase();
  const rows=S.items.filter(i=>(!filter||i.c===filter)&&(!q||[i.v,i.t,i.s,i.co,i.o,i.e].join(" ").toLowerCase().includes(q)));
  $("tb").innerHTML=view!=="table"?"":rows.length?rows.map(i=>`<tr class="${exp.has(i.id)?"open":""}">
    <td class="v">${esc(i.v)}</td><td class="t" title="${esc(i.t)}">${esc(i.t)}${tz(i)?`<div class="zh z0">${esc(tz(i))}</div>`:""}</td>
    <td class="s"><div class="sit"><i class="dot" style="background:${cat(i.c).c}"></i><span title="${esc(sit(i))}">${esc(sit(i))}</span></div>${zh(i)?`<div class="zh">${esc(zh(i))}</div>`:""}</td>
    <td><div class="ob">${esc(i.o)}</div>${oz(i)?`<div class="zh z0">${esc(oz(i))}</div>`:""}${i.e?`<div class="ex">${esc(i.e)}</div>`:""}</td>
    <td>${prev(i.p)}</td>
    <td class="act"><button data-x="${i.id}">${exp.has(i.id)?"Ver menos":"Ver mais"}</button> <button data-e="${i.id}">Editar</button> <button data-d="${i.id}">✕</button></td></tr>`).join(""):`<tr><td colspan="6" class="empty">${S.items.length?"Nenhum sinistro encontrado.":"Nenhum sinistro cadastrado. Clique em “+ Novo sinistro”."}</td></tr>`;
  $("tw").hidden=view!=="table";$("cards").hidden=view!=="cards";
  $("vc").classList.toggle("on2",view==="cards");$("vt").classList.toggle("on2",view==="table");
  $("cards").innerHTML=view!=="cards"?"":rows.length?rows.map(i=>{const o=exp.has(i.id),z=zh(i),t2=tz(i),o2=oz(i),c=cat(i.c);
    return `<div class="card ${o?"open":""}" style="border-top-color:${c.c}">
    <div class="ch"><b>${esc(i.v)}</b><div class="cp">${prev(i.p)}</div></div>
    <div class="ct">${esc(i.t)}</div>${t2?`<div class="zh z0">${esc(t2)}</div>`:""}
    <div class="cs"><i class="dot" style="background:${c.c}"></i><span>${esc(sit(i))}</span>${z?`<span class="zh z0">· ${esc(z)}</span>`:""}</div>
    <div class="cb"><div class="ob">${esc(i.o)}</div>${o2?`<div class="zh z0">${esc(o2)}</div>`:""}${i.e?`<div class="ex">${esc(i.e)}</div>`:""}</div>
    <div class="ca"><button data-x="${i.id}">${o?"Ver menos":"Ver mais"}</button><button data-e="${i.id}">Editar</button><button data-d="${i.id}">✕</button></div></div>`}).join(""):`<div class="empty">${S.items.length?"Nenhum sinistro encontrado.":"Nenhum sinistro cadastrado. Clique em “+ Novo sinistro”."}</div>`;
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const k=+b.dataset.x;exp.has(k)?exp.delete(k):exp.add(k);render()});
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>open(+b.dataset.e));
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("Excluir este sinistro?")){S.items=S.items.filter(i=>i.id!==+b.dataset.d);save();render()}});
}
function labelAll(){$("all").textContent=exp.size>=S.items.length?"Recolher tudo":"Expandir tudo"}
function open(id){
  editId=id;const i=S.items.find(x=>x.id===id)||{v:"",t:"",c:"terc",s:"",o:"",e:""};
  $("f_v").value=i.v;$("f_t").value=i.t;$("f_c").value=i.c;$("f_co").value=i.co||"";tgl();$("f_s").value=i.s;$("f_z").value=i.z||"";$("f_tz").value=i.tz||"";$("f_oz").value=i.oz||"";$("f_o").value=i.o;$("f_e").value=i.e;$("f_p").value=i.p||"";
  $("dlg").showModal();
}
$("add").onclick=()=>open(null);
$("tr").onclick=()=>window.open("https://translate.google.com/?sl=pt&tl=zh-CN&op=translate&text="+encodeURIComponent($("f_o").value),"_blank","noopener");
$("cx").onclick=()=>$("dlg").close();
$("ok").onclick=()=>{
  const d={v:$("f_v").value.trim().toUpperCase(),t:$("f_t").value.trim(),c:$("f_c").value,s:$("f_s").value.trim(),o:$("f_o").value.trim(),e:$("f_e").value.trim(),p:$("f_p").value,z:$("f_z").value.trim(),tz:$("f_tz").value.trim(),oz:$("f_oz").value.trim(),co:$("f_c").value==="out"?$("f_co").value.trim():""};
  if(!d.v){$("f_v").focus();return}
  if(d.c==="out"&&!d.co){$("f_co").focus();return}
  if(editId){Object.assign(S.items.find(x=>x.id===editId),d)}
  else{S.items.push({...d,id:Math.max(0,...S.items.map(x=>x.id))+1});S.date=new Date().toISOString().slice(0,10);$("dt").value=S.date}
  save();$("dlg").close();render();
};
$("q").oninput=render;
const setView=v=>{view=v;try{localStorage.setItem("sinistros-view",v)}catch(e){}render()};
$("vc").onclick=()=>setView("cards");$("vt").onclick=()=>setView("table");
$("all").onclick=()=>{const ids=S.items.map(i=>i.id);if(exp.size<ids.length)ids.forEach(x=>exp.add(x));else exp.clear();render()};
$("img").onclick=async()=>{
  if(!window.html2canvas){alert("Não foi possível carregar o gerador de imagem (verifique a internet).");return}
  document.body.classList.add("cap");

    const c=await html2canvas(document.querySelector(".wrap"),{scale:2,backgroundColor:"#ffffff"});

$("print").onclick=()=>{
  const t=document.title;document.title="Andamento de Sinistros - "+fmt(S.date).replace(/\//g,"-");
  window.onafterprint=()=>{document.title=t};window.print();
};
const tried=new Set();let busy=false;
const HAN=/[\u4e00-\u9fff]/;
async function viaMM(q){
  const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair=pt|zh-CN");
  const j=await r.json(),t=j&&j.responseData&&j.responseData.translatedText;
  if(!t||j.responseStatus!=200||/MYMEMORY WARNING/i.test(t)||!HAN.test(t))throw new Error("sem tradução");
  return t;
}
async function viaG(q){
  const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=pt&tl=zh-CN&dt=t&q="+encodeURIComponent(q));
  const j=await r.json(),t=j[0].map(x=>x[0]).join("");
  if(!HAN.test(t))throw new Error("sem tradução");
  return t;
}
async function mm(text){
  const parts=[];let cur="";
  for(const sn of text.split(/(?<=[.!?])\s+/)){if(cur&&(cur+" "+sn).length>450){parts.push(cur);cur=sn}else cur=cur?cur+" "+sn:sn}
  if(cur)parts.push(cur);
  const out=[];
  for(const q of parts){let t;try{t=await viaMM(q.slice(0,480))}catch(e){t=await viaG(q)}out.push(t)}
  return out.join(" ");
}
async function autoTr(){
  if(busy)return;busy=true;
  for(const i of S.items){
    for(const [src,man,dic,zs,za] of [["t","tz",1,"tzs","tza"],["o","oz",0,"ozs","oza"]]){
      const txt=(i[src]||"").trim();
      if(!txt||i[man]||i[zs]===i[src]||(dic&&tz({...i,tzs:null,tza:""})))continue;
      const k=i.id+"|"+src+"|"+txt;if(tried.has(k))continue;tried.add(k);
      try{const z=await mm(txt);i[zs]=i[src];i[za]=z;$("trn").textContent="";save();render()}catch(e){if(e instanceof TypeError)$("trn").textContent="Tradução automática indisponível neste endereço"}
    }
  }
  busy=false;
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const LB="sinistros-lastbk";
function bkNote(){let d=null;try{d=localStorage.getItem(LB)}catch(e){}
  const n=d?Math.floor((Date.now()-new Date(d))/864e5):null;
  $("bk").textContent=d?"Último backup: "+fmt(d):"Nenhum backup feito ainda";
  $("bk").style.color=(n===null||n>7)?"var(--red)":"var(--mut)"}
$("bkb").onclick=()=>{const d=new Date().toISOString().slice(0,10),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  a.download="sinistros-backup-"+d+".json";document.body.appendChild(a);a.click();a.remove();
  try{localStorage.setItem(LB,d)}catch(e){}bkNote()};
$("rsb").onclick=()=>$("rf").click();
$("rf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.items))throw 0;
    if(!confirm("Substituir os "+S.items.length+" sinistros atuais pelos "+j.items.length+" do backup?"))return;
    S=j;$("dt").value=S.date||"";save();render()}catch(x){alert("Arquivo de backup inválido.")}};
bkNote();
render();labelAll();
